name: Build Nexus preview copies

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/resize-nexus-previews.yml'

permissions:
  contents: write

jobs:
  resize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Pillow
        run: python -m pip install --quiet pillow

      - name: Create Nexus-sized preview copies
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          from PIL import Image

          targets = [
              ("Valheim/FreshCommands/previews/corpsecallers-effigy.jpg",
               "Valheim/FreshCommands/previews/corpsecallers-effigy-nexus.jpg"),
              ("Valheim/FreshCommands/previews/wayfarers-reach.jpg",
               "Valheim/FreshCommands/previews/wayfarers-reach-nexus.jpg"),
              ("Valheim/FreshCommands/previews/wayfarers-oathstone.jpg",
               "Valheim/FreshCommands/previews/wayfarers-oathstone-nexus.jpg"),
              ("Valheim/FreshDedicatedStorage/reliquary-storage-preview.png",
               "Valheim/FreshDedicatedStorage/reliquary-storage-preview-nexus.png"),
              ("Valheim/FreshDedicatedStorage/waystation-preview.png",
               "Valheim/FreshDedicatedStorage/waystation-preview-nexus.png"),
          ]

          for source_name, dest_name in targets:
              source = Path(source_name)
              dest = Path(dest_name)
              with Image.open(source) as image:
                  image.load()
                  if image.width <= 360:
                      resized = image.copy()
                  else:
                      height = round(image.height * 360 / image.width)
                      resized = image.resize((360, height), Image.Resampling.LANCZOS)
                  if dest.suffix.lower() in {".jpg", ".jpeg"}:
                      if resized.mode not in ("RGB", "L"):
                          resized = resized.convert("RGB")
                      resized.save(dest, quality=90, optimize=True, progressive=True)
                  else:
                      resized.save(dest, optimize=True)
                  print(f"{source} -> {dest}: {resized.width}x{resized.height}")
          PY

      - name: Commit Nexus preview copies
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/resize-nexus-previews.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Valheim/FreshCommands/previews/*-nexus.jpg
          git add Valheim/FreshDedicatedStorage/*-nexus.png
          git add -u .github/workflows/resize-nexus-previews.yml
          git commit -m "Add Nexus-sized preview images"
          git push
