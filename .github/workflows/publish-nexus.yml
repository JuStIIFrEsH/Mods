name: Publish Valheim mod to Nexus Mods

on:
  push:
    tags:
      - 'freshcommands-v*'
      - 'freshdedicatedstorage-v*'
  workflow_dispatch:
    inputs:
      mod:
        description: Existing release package to publish
        required: true
        type: choice
        options:
          - FreshCommands
          - FreshDedicatedStorage
      version:
        description: Existing package version, such as 2.1.0
        required: true
        type: string

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Select and validate released package
        id: package
        shell: bash
        env:
          INPUT_MOD: ${{ inputs.mod }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [[ "${GITHUB_EVENT_NAME}" == 'workflow_dispatch' ]]; then
            mod="$INPUT_MOD"
            version="$INPUT_VERSION"
            if [[ "$mod" == FreshCommands ]]; then
              dll=FreshCommands.dll
              file_id=8012718
            elif [[ "$mod" == FreshDedicatedStorage ]]; then
              dll=FreshStorage.dll
              file_id=8012748
            else
              echo 'Unsupported mod' >&2
              exit 1
            fi
          elif [[ "$GITHUB_REF_NAME" == freshcommands-v* ]]; then
            mod=FreshCommands
            dll=FreshCommands.dll
            file_id=8012718
            version="${GITHUB_REF_NAME#freshcommands-v}"
          elif [[ "$GITHUB_REF_NAME" == freshdedicatedstorage-v* ]]; then
            mod=FreshDedicatedStorage
            dll=FreshStorage.dll
            file_id=8012748
            version="${GITHUB_REF_NAME#freshdedicatedstorage-v}"
          else
            echo 'Unsupported release tag' >&2
            exit 1
          fi
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          source="Valheim/$mod/$mod-$version.zip"
          destination="$RUNNER_TEMP/$mod-$version-Nexus.zip"
          changelog="$RUNNER_TEMP/$mod-CHANGELOG.md"
          test -f "$source"
          python3 .github/scripts/package_nexus.py "$source" "$destination" \
            --name "$mod" --version "$version" --dll "$dll" --changelog "$changelog"
          echo "file_id=$file_id" >> "$GITHUB_OUTPUT"
          if [[ "$mod" == FreshCommands ]]; then
            echo 'mod_id=15749645078373' >> "$GITHUB_OUTPUT"
          else
            echo 'mod_id=15749645078374' >> "$GITHUB_OUTPUT"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "destination=$destination" >> "$GITHUB_OUTPUT"
          echo "changelog=$changelog" >> "$GITHUB_OUTPUT"

      - name: Select changelog for this release
        id: changelog
        shell: bash
        run: |
          set -euo pipefail
          python3 - "${{ steps.package.outputs.changelog }}" "${{ steps.package.outputs.version }}" "$RUNNER_TEMP/nexus-changelog.md" <<'PY'
          import re, sys
          from pathlib import Path
          source = Path(sys.argv[1])
          version = sys.argv[2]
          destination = Path(sys.argv[3])
          text = source.read_text(encoding='utf-8')
          match = re.search(rf'(?m)^##\s+{re.escape(version)}\s*$', text)
          if not match:
              destination.write_text('', encoding='utf-8')
              sys.exit(0)
          following = re.search(r'(?m)^##\s+', text[match.end():])
          section = text[match.end():match.end() + following.start()] if following else text[match.end():]
          section = section.strip()
          if not section:
              destination.write_text('', encoding='utf-8')
              sys.exit(0)
          destination.write_text(section + '\n', encoding='utf-8')
          PY
          echo 'text<<NEXUS_CHANGELOG' >> "$GITHUB_OUTPUT"
          cat "$RUNNER_TEMP/nexus-changelog.md" >> "$GITHUB_OUTPUT"
          echo 'NEXUS_CHANGELOG' >> "$GITHUB_OUTPUT"

      - name: Publish new Nexus file version
        uses: Nexus-Mods/upload-action@v1.0.0-beta.10
        with:
          api_key: ${{ secrets.NEXUS_TOKEN }}
          file_id: ${{ steps.package.outputs.file_id }}
          filename: ${{ steps.package.outputs.destination }}
          version: ${{ steps.package.outputs.version }}
          category: main
          primary_mod_manager_download: true
          update_mod_version: true
          mod_id: ${{ steps.package.outputs.mod_id }}
          changelog: ${{ steps.changelog.outputs.text }}
