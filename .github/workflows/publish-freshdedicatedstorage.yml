name: Publish FreshDedicatedStorage

on:
  push:
    tags:
      - 'freshdedicatedstorage-v*'

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - id: version
        name: Validate release tag and package
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#freshdedicatedstorage-v}"
          test "$version" != "$GITHUB_REF_NAME"
          package="Valheim/FreshDedicatedStorage/FreshDedicatedStorage-$version.zip"
          test -f "$package"
          test "$(unzip -p "$package" manifest.json | jq -r .version_number)" = "$version"
          mkdir -p dist
          cp "$package" dist/release-package.zip
          echo "value=$version" >> "$GITHUB_OUTPUT"

      - name: Publish to Thunderstore
        uses: dhkatz/thunderstore-publish@29609c8e55f47958ee84cc09d96ad1e72a0ea365
        with:
          token: ${{ secrets.THUNDERSTORE_TOKEN }}
          namespace: JuStIIFrEsH
          name: FreshDedicatedStorage
          version: ${{ steps.version.outputs.value }}
          communities: valheim
          # Existing Thunderstore package categories are retained on updates.
          # The publisher still requires one valid category value for submission.
          categories: tools
          description: Provides stackable Dedicated Storage Boxes with unlimited single-item capacity. Hugin's Reliquary automatically routes matching inventory items to storage. Munin's Waystation can send items from the wild to a linked Reliquary across vast distances.
          # The publisher action runs from / and prefixes this value with dist/.
          file: ../../github/workspace/dist/release-package.zip
