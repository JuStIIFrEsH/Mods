name: Publish FreshCommands

on:
  push:
    tags:
      - 'freshcommands-v*'
    branches:
      - 'publish-freshcommands-*'

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - id: version
        name: Validate release tag and package
        shell: bash
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            version="${GITHUB_REF_NAME#freshcommands-v}"
            test "$version" != "$GITHUB_REF_NAME"
          else
            version="${GITHUB_REF_NAME#publish-freshcommands-}"
            test "$version" != "$GITHUB_REF_NAME"
          fi
          package="Valheim/FreshCommands/FreshCommands-$version.zip"
          test -f "$package"
          test "$(unzip -p "$package" manifest.json | jq -r .version_number)" = "$version"
          mkdir -p dist
          cp "$package" dist/release-package.zip
          echo "value=$version" >> "$GITHUB_OUTPUT"

      - name: Publish to Thunderstore
        uses: dhkatz/thunderstore-publish@29609c8e55f47958ee84cc09d96ad1e72a0ea365
        with:
          token: ${{ secrets.THUNDERSTORE_TOKEN }}
          namespace: JuStIIFrEsH
          name: FreshCommands
          version: ${{ steps.version.outputs.value }}
          communities: valheim
          categories: tools
          description: FreshCommands adds Valheim console and chat commands for corpse recovery, distant corpse inventory retrieval, teleporting home or to corpses, and named teleport locations, plus quick-use teleportation structures.
          # The publisher action runs from / and prefixes this value with dist/.
          file: ../../github/workspace/dist/release-package.zip
